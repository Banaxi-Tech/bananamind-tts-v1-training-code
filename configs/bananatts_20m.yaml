project:
  name: BananaTTS-20M
  seed: 1337

dataset:
  name: MikhailT/lj-speech
  fallback_name: keithito/lj_speech
  split: train
  cache_dir: data/cache/ljspeech_22050
  validation_ratio: 0.02
  limit: null
  percent: null
  min_audio_seconds: 0.25
  max_audio_seconds: 20.0

text:
  use_phonemes: false
  keep_punctuation: true
  max_tokens: 256

audio:
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  f_min: 0.0
  f_max: 8000.0
  power: 1.0
  griffin_lim_iters: 32

model:
  hidden_size: 384
  encoder_layers: 6
  decoder_layers: 6
  attention_heads: 6
  ff_multiplier: 4
  dropout: 0.1
  duration_conv_channels: 384
  duration_kernel_size: 3
  max_duration: 120

training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.000001
  grad_clip: 1.0
  log_interval: 20
  val_interval: 500
  save_interval: 1000
  num_workers: 0
  checkpoints_dir: checkpoints
  runs_dir: runs
  resume: null
  mel_loss_weight: 1.0
  duration_loss_weight: 0.1
