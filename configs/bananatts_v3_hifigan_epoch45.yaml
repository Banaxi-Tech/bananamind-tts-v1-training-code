project:
  name: BananaTTS-20M-V3-HiFiGAN
  seed: 1337
dataset:
  name: MikhailT/lj-speech
  fallback_name: keithito/lj_speech
  split: train
  cache_dir: data/cache/ljspeech_22050
  validation_ratio: 0.02
  limit: null
  percent: null
  min_audio_seconds: 0.25
  max_audio_seconds: 20.0
text:
  use_phonemes: false
  keep_punctuation: true
  max_tokens: 256
audio:
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  f_min: 0.0
  f_max: 8000.0
  power: 1.0
  griffin_lim_iters: 32
model:
  hidden_size: 384
  encoder_layers: 6
  decoder_layers: 6
  attention_heads: 6
  ff_multiplier: 4
  dropout: 0.1
  duration_conv_channels: 384
  duration_kernel_size: 3
  max_duration: 120
vocoder:
  type: hifigan
  checkpoint: checkpoints_vocoder/vocoder_latest.pt
  initial_channels: 256
  upsample_rates:
  - 8
  - 8
  - 2
  - 2
  upsample_kernel_sizes:
  - 16
  - 16
  - 4
  - 4
  resblock_kernel_sizes:
  - 3
  - 7
  - 11
  resblock_dilation_sizes:
  - - 1
    - 3
    - 5
  - - 1
    - 3
    - 5
  - - 1
    - 3
    - 5
  leaky_relu_slope: 0.1
training:
  batch_size: 8
  epochs: 100
  learning_rate: 0.0002
  weight_decay: 1.0e-06
  grad_clip: 1.0
  log_interval: 20
  val_interval: 500
  save_interval: 1000
  num_workers: 0
  checkpoints_dir: checkpoints
  runs_dir: runs
  resume: null
  mel_loss_weight: 1.0
  duration_loss_weight: 0.1
vocoder_training:
  batch_size: 8
  epochs: 45
  learning_rate: 0.0002
  adam_b1: 0.8
  adam_b2: 0.99
  grad_clip: 10.0
  segment_frames: 64
  lambda_mel: 45.0
  lambda_feature: 2.0
  log_interval: 20
  save_interval: 1000
  num_workers: 0
  checkpoints_dir: checkpoints_vocoder
  resume: null
